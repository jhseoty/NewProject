<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 안내 백업입니다. 잘 올려주시기 바랍니다. 잘 해보자 친구야....</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-container">
        <h2>회원가입</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="confirmPassword">비밀번호 확인</label>
                <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
            </div>
            <button type="submit" class="submit-btn">가입하기</button>
        </form>
        <p class="login-link">이미 계정이 있으신가요? <a href="#">로그인</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
